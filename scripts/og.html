<!doctype html>
<!-- Source for public/og.png (1200×630): scripts/og.mjs renders it with headless Chromium. -->
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1200px;height:630px;background:#141413;color:#f2f1ec;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;overflow:hidden;position:relative}
  .glow{position:absolute;inset:-200px 300px auto -100px;height:700px;background:radial-gradient(closest-side,rgba(144,133,233,.18),transparent)}
  .l{position:absolute;left:80px;top:96px}
  .brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:650}
  .brand img{width:44px;height:44px}
  h1{margin:56px 0 0;font-size:88px;line-height:1;letter-spacing:-.035em;font-weight:650}
  p{margin:28px 0 0;color:#c3c2b7;font-size:28px}
  code{display:inline-block;margin-top:44px;padding:14px 22px;border:1px solid #383835;border-radius:12px;background:#1f1f1e;font:24px ui-monospace,'SF Mono',Menlo,monospace}
  code span{color:#898781}
  .file{position:absolute;right:-40px;top:120px;width:470px;border:1px solid #2c2c2a;border-radius:14px;background:#1f1f1e;font:17px/1.9 ui-monospace,'SF Mono',Menlo,monospace;color:#c3c2b7;box-shadow:0 30px 80px -20px #000}
  .tab{padding:12px 20px;border-bottom:1px solid #2c2c2a;background:#1b1b1a;font-size:15px;color:#898781}
  .file div.b{padding:14px 20px;white-space:pre}
  .m{color:#898781}.v{color:#9085e9}
</style></head><body>
<div class="glow"></div>
<div class="l">
  <div class="brand"><img src="../public/favicon.svg">Basalt</div>
  <h1>Your money<br>is a folder.</h1>
  <p>Local-first personal finance in plain files.</p>
  <code><span>$</span> brew install --cask navalm/tap/basalt</code>
</div>
<div class="file"><div class="tab">My Finances/</div><div class="b"><span class="m">▾</span> Accounts/
<span class="m">▾</span> Ledger/
    Chase Checking/<span class="v">2026.csv</span>
    Amex Gold/<span class="v">2026.csv</span>
<span class="m">▾</span> Recurring/
    Netflix.md
  Budgets/2026.md
  Rules.csv</div></div>
</body></html>
