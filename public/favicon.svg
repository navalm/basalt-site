<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Basalt app icon: three hexagonal basalt columns in the dark stone palette; the tallest
       top carries the app accent (#9085e9, PLAN.md section 3). macOS icon grid: an 824x824
       rounded square centred on the 1024 canvas. Rasterize with scripts/icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b29"/>
      <stop offset="1" stop-color="#141413"/>
    </linearGradient>
    <linearGradient id="topStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8d86"/>
      <stop offset="1" stop-color="#6c6a64"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3aaf3"/>
      <stop offset="1" stop-color="#7b6fe0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141413" stop-opacity="0"/>
      <stop offset="1" stop-color="#141413" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <polygon points="197.0,452.0 260.0,506.6 260.0,940.0 197.0,940.0" fill="#3b3b38"/>
    <polygon points="260.0,506.6 386.0,506.6 386.0,940.0 260.0,940.0" fill="#302f2d"/>
    <polygon points="386.0,506.6 449.0,452.0 449.0,940.0 386.0,940.0" fill="#252523"/>
    <polygon points="449.0,452.0 386.0,506.6 260.0,506.6 197.0,452.0 260.0,397.4 386.0,397.4" fill="url(#topStone)"/>
    <polygon points="575.0,492.0 638.0,546.6 638.0,940.0 575.0,940.0" fill="#3b3b38"/>
    <polygon points="638.0,546.6 764.0,546.6 764.0,940.0 638.0,940.0" fill="#302f2d"/>
    <polygon points="764.0,546.6 827.0,492.0 827.0,940.0 764.0,940.0" fill="#252523"/>
    <polygon points="827.0,492.0 764.0,546.6 638.0,546.6 575.0,492.0 638.0,437.4 764.0,437.4" fill="url(#topStone)"/>
    <polygon points="386.0,392.0 449.0,446.6 449.0,940.0 386.0,940.0" fill="#33295a"/>
    <polygon points="449.0,446.6 575.0,446.6 575.0,940.0 449.0,940.0" fill="#282048"/>
    <polygon points="575.0,446.6 638.0,392.0 638.0,940.0 575.0,940.0" fill="#1d1835"/>
    <polygon points="638.0,392.0 575.0,446.6 449.0,446.6 386.0,392.0 449.0,337.4 575.0,337.4" fill="url(#topAccent)"/>
    <rect x="100" y="700" width="824" height="224" fill="url(#fade)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
